# Configuration basic
server.port=${PORT:8080}
spring.application.name=api-gateway-services

# ==================== IAM SERVICE ====================
# Authentication - Public
spring.cloud.gateway.routes[0].id=iam-authentication-public
spring.cloud.gateway.routes[0].uri=https://backend-web-services-microservices-iam.onrender.com
spring.cloud.gateway.routes[0].predicates=Path=/api/v1/authentication/**
spring.cloud.gateway.routes[0].filters=StripPrefix=0

# Roles - Protected
spring.cloud.gateway.routes[1].id=iam-roles
spring.cloud.gateway.routes[1].uri=https://backend-web-services-microservices-iam.onrender.com
spring.cloud.gateway.routes[1].predicates=Path=/api/v1/roles/**
spring.cloud.gateway.routes[1].filters=StripPrefix=0

# Users - Protected
spring.cloud.gateway.routes[2].id=iam-users
spring.cloud.gateway.routes[2].uri=https://backend-web-services-microservices-iam.onrender.com
spring.cloud.gateway.routes[2].predicates=Path=/api/v1/users/**
spring.cloud.gateway.routes[2].filters=StripPrefix=0

# ==================== COURSES SERVICE ====================
spring.cloud.gateway.routes[3].id=courses-service
spring.cloud.gateway.routes[3].uri=https://backend-web-services-microservices.onrender.com
spring.cloud.gateway.routes[3].predicates=Path=/api/v1/courses/**
spring.cloud.gateway.routes[3].filters=StripPrefix=0

# ==================== ASSIGNMENTS SERVICE ====================
# Assignments - Protected
spring.cloud.gateway.routes[4].id=assignments-service
spring.cloud.gateway.routes[4].uri=https://backend-web-services-microservices-oski.onrender.com
spring.cloud.gateway.routes[4].predicates=Path=/api/v1/assignments/**
spring.cloud.gateway.routes[4].filters=StripPrefix=0

# Submissions - Protected
spring.cloud.gateway.routes[5].id=submissions-service
spring.cloud.gateway.routes[5].uri=https://backend-web-services-microservices-oski.onrender.com
spring.cloud.gateway.routes[5].predicates=Path=/api/v1/submissions/**
spring.cloud.gateway.routes[5].filters=StripPrefix=0


# Logging
logging.level.org.springframework.cloud.gateway=DEBUG